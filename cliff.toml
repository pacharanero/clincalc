# git-cliff configuration for calc
# https://git-cliff.org/docs/configuration
#
# CHANGELOG.md is regenerated from conventional-commit messages by `s/version++`
# at release time and committed in the same `chore(release): vX.Y.Z` commit, so
# the tag (and the GitHub Release notes cargo-dist scrapes from it) stay in sync.

[changelog]
header = """
# Changelog

All notable changes to `calc` are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/); versioning follows [SemVer](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
    {% if commit.breaking %} **[breaking]**{% endif %}\
    {% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/pacharanero/calc/commit/{{ commit.id }})){% endif %}
{% endfor %}\
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    # Link bare GitHub issue/PR refs.
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/pacharanero/calc/issues/${1}))" },
]
# Group headings follow calc's Keep-a-Changelog convention (Added/Fixed/Changed).
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^docs?", group = "Documentation" },
    { message = "^refactor", group = "Changed" },
    { message = "^build", group = "Build" },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^test", skip = true },
    { message = "^style", skip = true },
    { message = "^bump", skip = true },
    { body = ".*security", group = "Security" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "newest"
