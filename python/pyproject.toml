[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "clincalc"
dynamic = ["version"]
description = "Open, auditable clinical calculators - Python bindings for the clincalc Rust engine"
authors = [{name = "Marcus Baw", email = "marcus@bawmedical.co.uk"}]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-AGPL-3.0-or-later.txt", "medikquantis-notice.md"]
requires-python = ">=3.9"
readme = "README.md"
keywords = ["clinical", "medical", "calculator", "healthcare", "scoring"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
pandas = ["pandas>=1.0"]

[project.urls]
Repository = "https://github.com/pacharanero/clincalc"
Documentation = "https://pacharanero.github.io/clincalc/"

[tool.maturin]
# The Rust extension is installed as clincalc/_clincalc.so; the Python package
# wrapper in clincalc/__init__.py imports from it and re-exports the public API.
module-name = "clincalc._clincalc"
python-source = "."
features = ["pyo3/extension-module"]
