[package]
name = "clincalc-py"
version = "0.3.0"
edition = "2024"
authors = ["Marcus Baw"]
description = "Python bindings for clincalc - open, auditable clinical calculators"
license = "AGPL-3.0-or-later AND LGPL-3.0-or-later"
repository = "https://github.com/pacharanero/clincalc"

[lib]
name = "_clincalc"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = "1.0"
clincalc = { path = "..", default-features = false }
