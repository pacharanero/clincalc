name: Publish to crates.io

# Publishes the `clincalc` crate to crates.io on a release tag. Invoked by
# auto-tag.yml via workflow_call (the cascade); also triggerable manually
# (workflow_dispatch) or by a `v*` tag push to re-publish a given tag.
#
# Uses crates.io Trusted Publishing (OIDC) - no API token secret required.
# The trusted publisher is configured in crates.io crate settings.

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.2.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Test before publishing (publish is irreversible)
        run: cargo test --all-features --locked

      - name: Verify crates.io package
        run: cargo publish --dry-run --locked

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish clincalc to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          log="$RUNNER_TEMP/cargo-publish.log"
          if cargo publish --locked >"$log" 2>&1; then
            exit 0
          fi

          if grep -Eqi "already uploaded|already exists on crates.io index" "$log"; then
            echo "This crate version is already published on crates.io - treating as success."
            cat "$log"
            exit 0
          fi

          cat "$log" >&2
          exit 1
