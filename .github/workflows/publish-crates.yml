name: Publish to crates.io

# Publishes the `clincalc` crate to crates.io from a release tag. auto-tag.yml
# dispatches this top-level workflow after the binary/Homebrew release succeeds.
# For manual recovery, dispatch it with both the workflow ref and input set to
# the same existing `v*` tag.
#
# Uses crates.io Trusted Publishing (OIDC) - no API token secret required.
# The trusted publisher is configured in crates.io crate settings.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.2.0"
        required: true
        type: string

concurrency:
  group: publish-crates-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify crates.io package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag-bound dispatch
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "Dispatch ref $GITHUB_REF does not match refs/tags/$RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Verify release metadata
        run: s/check-release-version "$RELEASE_TAG"

      - name: Confirm the GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: s/check-github-release "$RELEASE_TAG"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Test before publishing (publish is irreversible)
        run: cargo test --all-features --locked

      - name: Verify crates.io package
        run: cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/clincalc
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish clincalc to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          log="$RUNNER_TEMP/cargo-publish.log"
          if cargo publish --no-verify --locked >"$log" 2>&1; then
            exit 0
          fi

          if grep -Eqi "already uploaded|already exists on crates.io index" "$log"; then
            echo "This crate version is already published on crates.io - treating as success."
            cat "$log"
            exit 0
          fi

          cat "$log" >&2
          exit 1
