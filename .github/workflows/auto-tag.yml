name: Auto-tag on version bump

# When a push to main bumps the workspace version in Cargo.toml, create and push
# the matching `v<version>` tag, run the binary/Homebrew release, then dispatch
# the crates.io and PyPI publishers at that tag.
#
# The cargo-dist workflow remains a reusable workflow. Registry publishers are
# top-level workflow_dispatch runs because Trusted Publishing identifies the
# top-level workflow, and PyPI does not support OIDC from reusable workflows.
# Dispatch is an explicit exception to GitHub's GITHUB_TOKEN anti-recursion
# guard. This is the auto-tag cascade documented in house style.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: Detect version bump and create tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      bumped: ${{ steps.bump.outputs.bumped }}
      ready: ${{ steps.create.outputs.ready }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Cargo.toml version change
        id: bump
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          new=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
          before="$BEFORE_SHA"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="HEAD~1"
          fi
          old=$(git show "$before:Cargo.toml" 2>/dev/null \
                  | grep -m1 '^version = "' | cut -d'"' -f2 || echo "")

          declare -A changed_versions=()
          while IFS= read -r commit; do
            current=$(git show "$commit:Cargo.toml" 2>/dev/null \
                      | grep -m1 '^version = "' | cut -d'"' -f2 || echo "")
            parent=$(git rev-parse "$commit^1" 2>/dev/null || true)
            parent_version=$(git show "$parent:Cargo.toml" 2>/dev/null \
                             | grep -m1 '^version = "' | cut -d'"' -f2 || echo "")
            if [ -n "$current" ] && [ "$current" != "$parent_version" ]; then
              changed_versions["$current"]=1
            fi
          done < <(git rev-list --full-history --reverse "$before..$GITHUB_SHA" -- Cargo.toml)

          if [ "${#changed_versions[@]}" -gt 1 ]; then
            echo "A push may contain only one release version change; push release commits separately." >&2
            exit 1
          fi

          if [ -z "$new" ]; then
            echo "::warning::Could not read version from Cargo.toml"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$new" = "$old" ]; then
            echo "No version change ($new == $old) - nothing to tag."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$new"
          echo "Cargo.toml: $old -> $new"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Verify release metadata
        if: steps.bump.outputs.bumped == 'true'
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: s/check-release-version "$RELEASE_TAG"

      - name: Create or verify tag
        id: create
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tag="$RELEASE_TAG"

          verify_tag_target() {
            local ref_json="$1"
            local object_type object_sha tag_json
            object_type=$(jq -r '.object.type' <<<"$ref_json")
            object_sha=$(jq -r '.object.sha' <<<"$ref_json")

            if [ "$object_type" = "tag" ]; then
              tag_json=$(gh api "/repos/$GITHUB_REPOSITORY/git/tags/$object_sha")
              object_type=$(jq -r '.object.type' <<<"$tag_json")
              object_sha=$(jq -r '.object.sha' <<<"$tag_json")
            fi

            if [ "$object_type" != "commit" ] || [ "$object_sha" != "$RELEASE_SHA" ]; then
              echo "Tag $tag resolves to $object_type $object_sha, not release commit $RELEASE_SHA." >&2
              return 1
            fi
          }

          if ref_json=$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null); then
            verify_tag_target "$ref_json"
            echo "Tag $tag already points to release commit $RELEASE_SHA - continuing recovery."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_object=$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$tag" \
            -f message="Release $tag" \
            -f object="$RELEASE_SHA" \
            -f type=commit \
            --jq .sha)

          if gh api --silent --method POST "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" \
            -f sha="$tag_object"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ref_json=$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null); then
            verify_tag_target "$ref_json"
            echo "Tag $tag was created concurrently at release commit $RELEASE_SHA."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exit 1

  release:
    needs: tag
    if: needs.tag.outputs.ready == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  publish-packages:
    name: Publish ${{ matrix.registry }}
    needs: [tag, release]
    if: needs.tag.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: crates.io
            workflow: publish-crates.yml
          - registry: PyPI
            workflow: publish-python.yml
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_WORKFLOW: ${{ matrix.workflow }}
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Dispatch publisher and wait for completion
        run: |
          payload=$(jq -n --arg tag "$RELEASE_TAG" \
            '{ref: $tag, inputs: {tag: $tag}, return_run_details: true}')
          response=$(gh api --method POST \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLISH_WORKFLOW/dispatches" \
            --input - <<<"$payload")

          run_url=$(jq -er '.run_url' <<<"$response")
          html_url=$(jq -er '.html_url' <<<"$response")
          echo "Publisher run: $html_url"

          for _attempt in $(seq 1 720); do
            if ! run=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "$run_url"); then
              sleep 10
              continue
            fi

            status=$(jq -r '.status' <<<"$run")
            if [ "$status" != "completed" ]; then
              sleep 10
              continue
            fi

            conclusion=$(jq -r '.conclusion' <<<"$run")
            if [ "$conclusion" = "success" ]; then
              echo "Publisher completed successfully: $html_url"
              exit 0
            fi

            echo "Publisher concluded with $conclusion: $html_url" >&2
            exit 1
          done

          echo "Timed out waiting for publisher: $html_url" >&2
          exit 1
