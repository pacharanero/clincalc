[package]
name = "clincalc"
version = "0.2.2"
edition = "2024"
authors = ["Marcus Baw"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/pacharanero/clincalc"
homepage = "https://github.com/pacharanero/clincalc"
description = "Open, auditable clinical calculators: a pure scoring engine plus the `clincalc` CLI in one crate. The engine is a serde-only leaf (build with default-features = false); the default `cli` feature adds the `clincalc` binary."
readme = "README.md"
documentation = "https://docs.rs/clincalc"
keywords = ["clinical", "medical", "calculator", "scoring", "healthcare"]
# Five-slot maximum on crates.io. `science::medicine` is the established slug;
# `command-line-utilities` keeps the CLI side discoverable.
categories = ["science", "command-line-utilities"]

[lib]
name = "clincalc"
path = "src/lib.rs"

# The standalone `clincalc` binary. Requires the `cli` feature (on by default), so a
# library-only consumer building with `default-features = false` gets the pure
# serde-only engine and never compiles clap / anyhow / clap_complete.
[[bin]]
name = "clincalc"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "rest-api"]
# The command-line surface: the `clincalc` binary plus the reusable `clincalc::cli`
# module (CalcCommand + run), embeddable by host CLIs such as GitEHR.
cli = ["dep:anyhow", "dep:clap", "dep:clap_complete"]
mcp = ["cli", "dep:rmcp", "dep:tokio"]
# HTTP REST API surface: `clincalc api [--port 8080] [--host 127.0.0.1]`.
# On by default; exclude with `default-features = false` for a lighter binary.
rest-api = ["cli", "dep:axum", "dep:tokio"]

[dependencies]
# The leaf engine depends only on serde. Everything the CLI needs is optional
# and gated behind the `cli` feature, so the default-features-off surface stays
# a pure, trivially-auditable, trivially-embeddable leaf.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = { version = "1", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
clap_complete = { version = "4.6", optional = true }
axum = { version = "0.8.9", optional = true }
rmcp = { version = "3.1.0", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"], optional = true }

[package.metadata.docs.rs]
all-features = true

[package.metadata.wix]
upgrade-guid = "53C371C7-A0F3-445B-B0D1-567A0DF17F70"
path-guid = "A1A62FB5-0A76-4664-AF70-91F60BA2EA69"
license = false
eula = false

# The Tauri desktop GUI and the Python bindings crate are separate packages with
# their own dependency graphs and lockfiles (webkit / webview and PyO3 / maturin
# respectively); exclude them so `cargo build` for the engine + CLI never pulls
# those in. This [workspace] section also makes the repo root the workspace root,
# so cargo-dist reads [workspace.metadata.dist] below.
[workspace]
exclude = ["gui/src-tauri", "python"]

# cargo-dist builds and ships the `clincalc` binary (archives + shell / powershell /
# homebrew / msi installers) from the vX.Y.Z tag. Regenerate
# .github/workflows/release.yml with `dist generate --mode ci` after config
# edits. Version pinned to the house-style known-good line.
[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell", "powershell", "homebrew", "msi"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false
# One shared tap for all projects. Needs a HOMEBREW_TAP_TOKEN secret (PAT with
# write access to the tap repo) on this repo for the release job to push.
tap = "pacharanero/homebrew-tap"
publish-jobs = ["homebrew"]
publish-prereleases = false
# We hand-edit release.yml to pin action SHAs and add the workflow_call trigger
# for the auto-tag cascade; tell dist not to error on the resulting drift.
allow-dirty = ["ci"]

# The profile 'dist' builds release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"
